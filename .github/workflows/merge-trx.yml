name: Merge TRX (reusable + dispatch)

on:
  workflow_call:
    inputs:
      results_dir:
        description: 'Directory containing per-job TRX files'
        required: false
        default: 'artifacts/test-results'
      output_file:
        description: 'Path for merged TRX output'
        required: false
        default: 'artifacts/test-results/all-tests.trx'
  workflow_dispatch:
    inputs:
      results_dir:
        description: 'Directory containing per-job TRX files'
        required: false
      output_file:
        description: 'Path for merged TRX output'
        required: false

jobs:
  merge-trx:
    name: Merge per-job TRX into canonical all-tests.trx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run TRX merger
        env:
          RESULTS_DIR: ${{ github.event_name == 'workflow_call' && inputs.results_dir || github.event.inputs.results_dir || 'artifacts/test-results' }}
          OUTPUT_FILE: ${{ github.event_name == 'workflow_call' && inputs.output_file || github.event.inputs.output_file || 'artifacts/test-results/all-tests.trx' }}
        run: |
          echo "Using results dir: $RESULTS_DIR"
          echo "Using output file: $OUTPUT_FILE"
          python3 scripts/ci/merge_trx.py "$RESULTS_DIR" "$OUTPUT_FILE" || (
            echo "merge_trx failed, attempting fallback copy" && \
            find "$RESULTS_DIR" -name "*.trx" -print -quit | xargs -r cp -v -t "$(dirname "$OUTPUT_FILE")" || true
          )

      - name: Upload merged TRX
        uses: actions/upload-artifact@v4
        with:
          name: test-results-all
          path: ${{ github.event_name == 'workflow_call' && inputs.output_file || github.event.inputs.output_file || 'artifacts/test-results/all-tests.trx' }}
