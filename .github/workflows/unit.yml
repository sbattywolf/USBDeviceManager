name: Unit Tests (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Debug'
      dotnet-version:
        description: 'Dotnet SDK version'
        required: false
        type: string
        default: '8.0.x'

jobs:
  run-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./ci-artifacts
        # don't fail if artifacts are not present (e.g., running unit-only)
        continue-on-error: true

      - name: Show CI config (if present)
        run: |
          if [ -f ./ci-artifacts/ci-config.json ]; then
            echo '--- ci-config.json ---'
            cat ./ci-artifacts/ci-config.json
            echo '---------------------'
          else
            echo 'No ci-config.json found; proceeding with local defaults.'
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore USBDeviceManager.sln

      - name: Test
        run: |
          mkdir -p ./artifacts/test-results
          dotnet test USBDeviceManager.sln --configuration ${{ inputs.configuration }} --results-directory ./artifacts/test-results --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: '**/TestResults/*.trx'
