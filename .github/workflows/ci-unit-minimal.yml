name: CI Unit Minimal
on:
  workflow_dispatch:
    inputs:
      collect_ci_logs:
        description: 'Enable CI logs collection for this run (true/false)'
        required: false
        default: 'false'

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Discover and run test projects
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-results/unit/${{ runner.os }}
          ran=0
          # prefer tracked test projects
          for p in $(git ls-files "*.Tests.csproj" || true); do
            ran=1
            name=$(basename "$p" .csproj)
            echo "Running tests for $p"
            dotnet test "$p" --configuration Release --logger "trx;LogFileName=${name}.trx" --results-directory artifacts/test-results/unit/${{ runner.os }} 2>&1 | tee artifacts/test-results/unit/${{ runner.os }}/${name}.console.log || true
          done
          if [ $ran -eq 0 ]; then
            echo "No tracked test projects found; searching filesystem..."
            while IFS= read -r p; do
              ran=1
              name=$(basename "$p" .csproj)
              echo "Running tests for $p"
              dotnet test "$p" --configuration Release --logger "trx;LogFileName=${name}.trx" --results-directory artifacts/test-results/unit/${{ runner.os }} 2>&1 | tee artifacts/test-results/unit/${{ runner.os }}/${name}.console.log || true
            done < <(find . -type f -name "*.Tests.csproj" -print)
          fi
          if [ $ran -eq 0 ]; then
            echo "No test projects found; aborting"
            exit 1
          fi

      - name: Copy canonical TRX
        run: |
          mkdir -p artifacts/test-results
          # pick the first trx as canonical all-tests.trx
          $trx=$(ls artifacts/test-results/unit/${{ runner.os }}/*.trx | Select-Object -First 1)
          if [ -n "$trx" ]; then cp "$trx" artifacts/test-results/all-tests.trx; fi

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: |
            artifacts/test-results/**
            scripts/ci/parse_test_logs.py

      - name: Setup Python (for log parsing)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Parse TRX and console logs to produce skip-info
        run: |
          python scripts/ci/parse_test_logs.py --results artifacts/test-results/unit/${{ runner.os }} --out artifacts/test-results/skip-info.json
      - name: Upload skip-info artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-skip-info
          path: artifacts/test-results/skip-info.json
