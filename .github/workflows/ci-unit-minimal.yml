name: CI Unit Minimal
on:
  workflow_dispatch:
    inputs:
      collect_ci_logs:
        description: 'Enable CI logs collection for this run (true/false)'
        required: false
        default: 'false'

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Find solution file
        id: find_sln
        run: |
          set -euo pipefail
          sln=$(git ls-files '*.sln' | sed -n '1p' || true)
          if [ -z "$sln" ]; then
            sln=$(find . -type f -name "*.sln" -print -quit || true)
            # strip leading ./ if present
            sln=${sln#./}
          fi
          if [ -z "$sln" ]; then
            echo "No .sln file found in repository. Listing files for debugging..."
            git ls-files | sed -n '1,200p'
            exit 1
          fi
          echo "sln=$sln" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "${{ steps.find_sln.outputs.sln }}" --verbosity minimal

      - name: Build
        run: dotnet build "${{ steps.find_sln.outputs.sln }}" --configuration Release --no-restore

      - name: Run unit tests and collect TRX + console log
        run: |
          mkdir -p artifacts/test-results/unit/${{ runner.os }}
          dotnet test "${{ steps.find_sln.outputs.sln }}" --configuration Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results/unit/${{ runner.os }} 2>&1 | tee artifacts/test-results/unit/${{ runner.os }}/unit.console.log

      - name: Copy canonical TRX
        run: |
          mkdir -p artifacts/test-results
          # pick the first trx as canonical all-tests.trx
          $trx=$(ls artifacts/test-results/unit/${{ runner.os }}/*.trx | Select-Object -First 1)
          if [ -n "$trx" ]; then cp "$trx" artifacts/test-results/all-tests.trx; fi

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: |
            artifacts/test-results/**
            scripts/ci/parse_test_logs.py

      - name: Setup Python (for log parsing)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Parse TRX and console logs to produce skip-info
        run: |
          python scripts/ci/parse_test_logs.py --results artifacts/test-results/unit/${{ runner.os }} --out artifacts/test-results/skip-info.json
      - name: Upload skip-info artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-skip-info
          path: artifacts/test-results/skip-info.json
