---
name: Check TODO centralization
on:
  pull_request:
  push:
    branches: ["**"]
jobs:
  check-todos:
    name: Fail on TODOs outside centralized list
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find TODOs in Markdown
        run: |
          set -e
          # Find TODO occurrences in .md files
          matches=$(git grep -n -I -E "\\bTODO\\b" -- '*.md' || true)
          # Exclude the centralized TODO file and docs archive/session folders
          # Also ignore the legacy TODO-IMPLEMENTATION-GUIDE.md which is archived
          # Exclude vendored/virtualenv/worktree paths and the centralized TODO file
          # Also ignore common vendored and ephemeral paths to avoid third-party TODOs
          filtered=$(echo "$matches" | \
            grep -v "^docs/TODOs-collected.md" | \
            grep -v "^docs/" | \
            grep -v "^TODO-IMPLEMENTATION-GUIDE.md" | \
            grep -v "^\\.venv/" | \
            grep -v "^\\.worktrees/" | \
            grep -v "^node_modules/" | \
            grep -v "^venv/" | \
            grep -v "^artifacts/" | \
            grep -v "^publish/" | \
            grep -v "^\\.tmp/" || true)
          if [ -n "$filtered" ]; then
            echo "Found TODOs outside docs/TODOs-collected.md:\n"
            echo "$filtered"
            echo
            echo "Action required: move actionable TODOs into docs/TODOs-collected.md or update docs/CONTRIBUTING-TODO.md with guidance."
            exit 1
          else
            echo "No external TODOs found."
          fi
