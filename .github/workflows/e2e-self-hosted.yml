name: E2E Self-Hosted Runner

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  e2e-self-hosted:
    # Requires a self-hosted runner with Windows label and an 'e2e' label.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - Windows
      - e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for dotnet
        id: check_dotnet
        shell: pwsh
        run: |
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if ($null -ne $dotnet) {
            Write-Host 'dotnet present on runner'
            Add-Content -Path $Env:GITHUB_OUTPUT -Value "present=true"
          } else {
            Write-Host 'dotnet NOT present on runner'
            Add-Content -Path $Env:GITHUB_OUTPUT -Value "present=false"
          }

      - name: Setup .NET
        if: ${{ steps.check_dotnet.outputs.present != 'true' }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Verify system .NET on runner
        shell: pwsh
        run: |
          Write-Host "dotnet present: ${{ steps.check_dotnet.outputs.present }}"
          if ('${{ steps.check_dotnet.outputs.present }}' -eq 'true') {
            dotnet --info
          } else {
            Write-Host 'dotnet not installed on this runner'
          }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: pwsh
        run: |
          # Retry wrapper for transient NuGet failures (3 attempts with exponential backoff)
          $maxAttempts = 3
          $baseDelay = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "dotnet restore attempt $i of $maxAttempts"
            dotnet restore ./USBDeviceManager.sln --verbosity minimal
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxAttempts) {
              $delay = $baseDelay * [math]::Pow(2, $i - 1)
              Write-Host "Restore failed; sleeping $delay seconds before retrying..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "dotnet restore failed after $maxAttempts attempts"
            exit 1
          }

      - name: Validate runner prerequisites
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-e2e-runner.ps1 -RunBuild

      - name: Build
        run: dotnet build server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Release --no-restore

      - name: Run Agent E2E tests (self-hosted)
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\test-results | Out-Null
          dotnet test server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Debug --logger "trx;LogFileName=AgentE2E.selfhost.trx" --results-directory .\artifacts\test-results

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-selfhost
          path: server/AgentE2E.Tests/**/TestResults/*.trx

