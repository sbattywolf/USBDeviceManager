name: E2E Self-Hosted Runner

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  e2e-self-hosted:
    # Requires a self-hosted runner with Windows label and an 'e2e' label.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - Windows
      - e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify system .NET (pre-check)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\ci\precheck_dotnet.ps1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\ci\restore_nuget_with_retries.ps1

      - name: Validate runner prerequisites
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-e2e-runner.ps1 -RunBuild

      - name: Build and Run Agent E2E tests (self-hosted)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\ci\run_e2e_selfhost.ps1

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-selfhost
          path: |
            artifacts/test-results/*.trx
            server/AgentE2E.Tests/**/TestResults/*.trx

