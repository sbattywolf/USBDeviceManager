          if [ -f regression-enriched-report.txt ]; then cp regression-enriched-report.txt artifacts/enriched/$PREFIX/regression-enriched-report.txt || true; fi

      - name: Upload regression enriched errors (prefixed)
        if: steps.summary.outputs.failed_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: regression-enriched-errors-${{ github.run_id }}-${{ github.job }}-${{ runner.os }}
          path: artifacts/enriched/${{ github.run_id }}-${{ github.job }}-${{ runner.os }}/regression-enriched-errors.txt

