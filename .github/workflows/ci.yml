name: CI

on:
  push:
    branches: [ main, master, '**/chore/**', '**/feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  gui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system GUI dependencies
        run: |
          set -e
          sudo apt-get update
          # Install Mesa/GL packages commonly required by headless PyQt/OpenGL users.
          # Relax package list to use packages available on newer Ubuntu runners,
          # and include `mesa-utils` as a fallback.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libgbm1 xvfb mesa-utils \
            libx11-6 libxrender1 libxext6 libxcb1 libxkbcommon0 \
            ca-certificates || true
          sudo apt-get clean || true

      - name: Install GUI requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt

      - name: Run GUI tests (headless with Xvfb)
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -s "-screen 0 1280x1024x24" pytest -q gui/tests

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: gui-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: pwsh
        run: |
          # Retry wrapper for transient NuGet failures (3 attempts with exponential backoff)
          $maxAttempts = 3
          $baseDelay = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "dotnet restore attempt $i of $maxAttempts"
            dotnet restore USBDeviceManager.sln --verbosity minimal
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxAttempts) {
              $delay = $baseDelay * [math]::Pow(2, $i - 1)
              Write-Host "Restore failed; sleeping $delay seconds before retrying..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "dotnet restore failed after $maxAttempts attempts"
            exit 1
          }

      - name: Publish long-run test helper
        shell: pwsh
        run: |
          if (Test-Path test-helpers/LongRunner) {
            dotnet publish test-helpers/LongRunner/LongRunner.csproj -c Release -o ./artifacts/longrunner
            Write-Host 'Published LongRunner to ./artifacts/longrunner'
          } else {
            Write-Host 'No long-run helper found; continuing without it.'
          }

      - name: Detect long-sleep command for ShellRunner tests
        run: |
          echo "Detecting long-sleep helper for ShellRunner tests"
        # This step sets SHELLRUNNER_LONG_CMD via separate OS-specific steps below

      - name: Set SHELLRUNNER_LONG_CMD (Linux)
        if: runner.os == 'Linux' || runner.os == 'Ubuntu' || runner.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Prefer published LongRunner helper if available
          if [ -f ./artifacts/longrunner/LongRunner.dll ]; then
            echo "SHELLRUNNER_LONG_CMD=dotnet|./artifacts/longrunner/LongRunner.dll --duration=30" >> $GITHUB_ENV
            echo "Set SHELLRUNNER_LONG_CMD to LongRunner via dotnet"
          elif [ -x /bin/bash ] && /bin/bash -c "sleep 0" >/dev/null 2>&1; then
            echo "SHELLRUNNER_LONG_CMD=/bin/bash|-c \"sleep 30\"" >> $GITHUB_ENV
            echo "Set SHELLRUNNER_LONG_CMD for bash"
          elif command -v sleep >/dev/null 2>&1; then
            # fallback to sh wrapper
            echo "SHELLRUNNER_LONG_CMD=/bin/sh|-c \"sleep 30\"" >> $GITHUB_ENV
            echo "Set SHELLRUNNER_LONG_CMD for sh"
          else
            echo "No sleep command detected; leaving SHELLRUNNER_LONG_CMD unset"
          fi

      - name: Set SHELLRUNNER_LONG_CMD (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Prefer published LongRunner helper if available
          $helperDll = Join-Path $GITHUB_WORKSPACE 'artifacts/longrunner/LongRunner.dll'
          if (Test-Path $helperDll) {
            "SHELLRUNNER_LONG_CMD=dotnet|$helperDll --duration=30" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
            Write-Host "Set SHELLRUNNER_LONG_CMD to LongRunner via dotnet"
          }
          else {
            # Prefer Windows PowerShell Start-Sleep; fall back to PowerShell Core if needed
            if (Get-Command powershell -ErrorAction SilentlyContinue) {
              "SHELLRUNNER_LONG_CMD=powershell|-Command Start-Sleep -Seconds 30" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
              Write-Host "Set SHELLRUNNER_LONG_CMD for powershell"
            }
            elseif (Get-Command pwsh -ErrorAction SilentlyContinue) {
              "SHELLRUNNER_LONG_CMD=pwsh|-Command Start-Sleep -Seconds 30" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
              Write-Host "Set SHELLRUNNER_LONG_CMD for pwsh"
            }
            else {
              Write-Host "No PowerShell found; leaving SHELLRUNNER_LONG_CMD unset"
            }
          }

      - name: Enable in-process smoke server for CI (cross-platform)
        run: |
          echo "SMOKE_USE_TESTSERVER=1" >> $GITHUB_ENV
        # keep this available for all matrix OSes so functional smoke tests use TestServer in CI

      - name: Ensure server stopped (optional auto-kill)
        shell: pwsh
        run: |
          if (Test-Path .\scripts\ensure-server-stopped.ps1) {
            Write-Host 'Running ensure-server-stopped.ps1 (respects AUTO_KILL env var).'
            & .\scripts\ensure-server-stopped.ps1
            $rc = $LASTEXITCODE
            if ($rc -eq 2) {
              Write-Host "ensure-server-stopped returned 2 (AUTO_KILL=false and process present). Continuing as configured."
            } elseif ($rc -ne 0) {
              throw "ensure-server-stopped.ps1 failed with exit code $rc"
            }
          } else {
            Write-Host 'No ensure-server-stopped.ps1 present; skipping.'
          }

      - name: Build
        run: dotnet build USBDeviceManager.sln --configuration Release --no-restore

      - name: Run Unit tests (produce TRX)
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Unit" --logger "trx;LogFileName=dotnet-tests-${{ matrix.os }}.trx"

      - name: Run isolated AgentHeartbeat tests
        shell: pwsh
        run: |
          if (Test-Path server/AgentHeartbeat.Tests) {
            dotnet test server/AgentHeartbeat.Tests/AgentHeartbeat.Tests.csproj --configuration Debug --logger "trx;LogFileName=agentheartbeat-${{ matrix.os }}.trx"
          } else {
            Write-Host 'No isolated AgentHeartbeat.Tests project found; skipping.'
          }

      - name: Upload dotnet test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-tests-${{ matrix.os }}
          path: |
            # Directly named trx files created by dotnet test at repo root or project folders
            '**/*dotnet-tests-${{ matrix.os }}.trx'
            '**/*dotnet-tests.local.trx'
            # Standard TestResults folders produced by dotnet test
            '**/TestResults/*.trx'
            '**/*/TestResults/*.trx'
            # AgentHeartbeat isolated project test results
            server/AgentHeartbeat.Tests/**/TestResults/*.trx
            # Any trx under server test projects
            server/**/TestResults/*.trx

      - name: Run sanitize-repo check (PowerShell script)
        shell: pwsh
        run: |
          if (Test-Path .\scripts\sanitize-repo.ps1) { .\scripts\sanitize-repo.ps1 -CheckOnly } else { Write-Host 'No sanitize script present, skipping.' }

      - name: Run PowerShell agent tests (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path .\ci\run-tests.ps1) {
            .\ci\run-tests.ps1 -RunAgentTests -RunServerTests:$false -NonInteractive
          } elseif (Test-Path .\agent\SimRacingAgent.Tests) {
            Import-Module Pester -Force -MinimumVersion 5.0
            Invoke-Pester -Script @{ Path = '.\agent\SimRacingAgent.Tests'; OutputFormat = 'NUnitXml'; OutputFile = 'agent-pester-results.xml' }
            Write-Host 'Pester results: agent-pester-results.xml'
          } else {
            Write-Host 'No agent tests found; skipping.'
          }

      - name: Run Master TestRunner (PowerShell, cross-platform)
        shell: pwsh
        run: |
          if (Test-Path ./agent/SimRacingAgent.Tests/TestRunner.ps1) {
            Write-Host 'Invoking master TestRunner (agent + server focused runners)...'
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./agent/SimRacingAgent.Tests/TestRunner.ps1
          } else {
            Write-Host 'No master TestRunner found; skipping.'
          }

      - name: Upload agent test results (Windows only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-tests-windows
          path: |
            agent-pester-results.xml
            **/TestResults/*.trx
            agent/SimRacingAgent.Tests/Integration/logs/**
            server/USBDeviceManager.Tests/Integration/logs/**
            agent/SimRacingAgent.Tests/Functional/logs/**
            agent/SimRacingAgent.Tests/logs/**

      - name: Upload server logs (build matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.os }}
          path: |
            scripts/tmp/server.log
            scripts/tmp/server.err.log
            scripts/tmp/ensure-stopped.log
  e2e-windows:
    runs-on: windows-latest
    needs: build-and-test
    # Make this job non-blocking so PRs are not blocked by E2E flakes
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore USBDeviceManager.sln

      - name: Build
        run: dotnet build server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Release --no-restore

      - name: Run Agent E2E tests (Windows)
        run: |
          dotnet test server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Debug --logger "trx;LogFileName=AgentE2E.windows.trx"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-windows
          path: server/AgentE2E.Tests/**/TestResults/*.trx

  integration-tests:
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Start server for Integration tests (PowerShell)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./scripts/start-server-and-wait.ps1) { .\scripts\start-server-and-wait.ps1 -NonInteractive } else { Write-Host 'No orchestration script present, skipping server start.' }

      - name: Run Integration tests
        shell: pwsh
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Integration" --logger "trx;LogFileName=integration-${{ runner.os }}.trx"

      - name: Stop test environment (PowerShell)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./scripts/stop-test-environment.ps1) { .\scripts\stop-test-environment.ps1 } else { Write-Host 'No stop script present.' }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ runner.os }}
          path: |
            scripts/tmp/server.log
            scripts/tmp/server.err.log
            scripts/tmp/ensure-stopped.log

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-${{ runner.os }}
          path: '**/*integration-${{ runner.os }}.trx'
