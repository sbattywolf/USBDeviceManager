---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect_ci_logs:
        description: 'Enable CI logs collection for this run (true/false)'
        required: false
        default: 'false'
jobs:
  gui-tests:
    name: GUI Tests (headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system GUI dependencies
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libgbm1 xvfb mesa-utils \
            libx11-6 libxrender1 libxext6 libxcb1 libxkbcommon0 \
            ca-certificates || true

      - name: Install GUI requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f gui/requirements.txt ]; then pip install -r gui/requirements.txt || true; else echo 'No gui/requirements.txt found; skipping'; fi

      - name: Run GUI tests (headless)
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          if [ -d gui/tests ]; then xvfb-run -s "-screen 0 1280x1024x24" pytest -q gui/tests || true; else echo 'No gui/tests directory; skipping GUI tests'; fi

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      # (unit-tests job moved to a reusable workflow: see the 'unit-tests' job below)

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: pwsh
        run: |
          # Retry wrapper for transient NuGet failures (3 attempts with exponential backoff)
          $maxAttempts = 3
          $baseDelay = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "dotnet restore attempt $i of $maxAttempts"
            dotnet restore ./USBDeviceManager.sln --verbosity minimal
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxAttempts) {
              $delay = $baseDelay * [math]::Pow(2, $i - 1)
              Write-Host "Restore failed; sleeping $delay seconds before retrying..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "dotnet restore failed after $maxAttempts attempts"
            exit 1
          }

      - name: Build server for Integration tests
        shell: pwsh
        run: |
          Write-Host 'Building server/USBDeviceManager (Release) so --no-build later can use outputs'
          dotnet build ./server/USBDeviceManager -c Release --no-restore

      - name: Publish long-run test helper
        shell: pwsh
        run: |
          if (Test-Path test-helpers/LongRunner) {
            if ($env:RUNNER_OS -and $env:RUNNER_OS -ieq 'Windows') {
              # Produce a self-contained Windows exe under artifacts/longrunner/win-x64
              dotnet publish test-helpers/LongRunner/LongRunner.csproj -c Release -r win-x64 --self-contained true -o ./artifacts/longrunner/win-x64
              Write-Host 'Published LongRunner (win-x64 exe) to ./artifacts/longrunner/win-x64'
            } else {
              # Default: publish portable dll for non-Windows runners
              dotnet publish test-helpers/LongRunner/LongRunner.csproj -c Release -o ./artifacts/longrunner
              Write-Host 'Published LongRunner (dll) to ./artifacts/longrunner'
            }
          } else {
            Write-Host 'No long-run helper found; continuing without it.'
          }

      - name: Assert LongRunner artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exeCandidate = Join-Path $env:GITHUB_WORKSPACE 'artifacts/longrunner/win-x64/LongRunner.exe'
          if (-not (Test-Path $exeCandidate)) {
            Write-Error "LongRunner exe missing at $exeCandidate. Ensure 'dotnet publish' produced the artifact and the publish step ran on a Windows runner."
            exit 1
          } else {
            Write-Host "LongRunner exe present: $exeCandidate"
          }

      - name: Build
        run: dotnet build ./USBDeviceManager.sln --configuration Release --no-restore

      - name: Publish server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host 'Publishing server self-contained exe for Windows'
          dotnet publish ./server/USBDeviceManager -c Release -r win-x64 --self-contained true -o ./server/USBDeviceManager/bin/Release/net8.0/win-x64
          $exe = Join-Path $PWD './server/USBDeviceManager/bin/Release/net8.0/win-x64/SMServer.exe'
          if (-not (Test-Path $exe)) {
            Write-Error "Published server exe missing at $exe. Ensure publish step ran and project AssemblyName is set to 'SMServer'."
            exit 1
          } else {
            Write-Host "Published server exe at $exe"
            # Also copy the published exe into the framework folder so tests
            # and existing scripts that look for the exe under net8.0 find it.
            $frameworkExe = Join-Path $PWD './server/USBDeviceManager/bin/Release/net8.0/SMServer.exe'
            if (-not (Test-Path $frameworkExe)) {
              Copy-Item -Path $exe -Destination $frameworkExe -Force
              Write-Host "Copied published exe to $frameworkExe"
            } else {
              Write-Host "$frameworkExe already exists; skipping copy"
            }
          }
