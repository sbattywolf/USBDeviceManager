  final-report:
    name: CI Final Test Summary
    runs-on: ubuntu-latest
    env:
      HTML_COMMENT_MAX_CHARS: '60000'
    # Run after the core build so the aggregator executes for focused/unit-only
    # dispatches where the `test-runner` job may be absent or skipped at the
    # target ref. Avoid depending on `test-runner` to allow aggregation even
    # when only unit tests were executed.
    needs: [build-and-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts for aggregation
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded
        continue-on-error: true

      - name: Rehydrate downloaded artifacts into expected folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/summaries/unit artifacts/summaries/tests artifacts/summaries/e2e artifacts/summaries/integration \
                   artifacts/enriched/unit artifacts/enriched/tests artifacts/enriched/e2e artifacts/enriched/integration artifacts/enriched/regression artifacts/downloaded-raw
          for d in artifacts/downloaded/*; do
            [ -d "$d" ] || continue
            bn=$(basename "$d")
            # Summaries
            case "$bn" in
              tests-summary* ) cp -r "$d"/* artifacts/summaries/tests/ || true ;;
              unit-tests-summary* ) cp -r "$d"/* artifacts/summaries/unit/ || true ;;
              regression-tests-summary* ) cp -r "$d"/* artifacts/summaries/regression/ || true ;;
              integration-tests-summary* ) cp -r "$d"/* artifacts/summaries/integration/ || true ;;
              e2e-tests-summary* ) cp -r "$d"/* artifacts/summaries/e2e/ || true ;;
            esac
            # Enriched reports (different jobs may have suffixed names)
            if ls "$d"/*integration-enriched-report.txt >/dev/null 2>&1; then
              mkdir -p artifacts/enriched/integration
              cp "$d"/*integration-enriched-report.txt artifacts/enriched/integration/ || true
            fi
            if ls "$d"/*regression-enriched-report.txt >/dev/null 2>&1; then
              mkdir -p artifacts/enriched/regression
              cp "$d"/*regression-enriched-report.txt artifacts/enriched/regression/ || true
            fi
            if ls "$d"/*unit-tests-enriched-report.txt >/dev/null 2>&1; then
              mkdir -p artifacts/enriched/unit
              cp "$d"/*unit-tests-enriched-report.txt artifacts/enriched/unit/ || true
            fi
            if ls "$d"/*e2e-enriched-report.txt >/dev/null 2>&1; then
              mkdir -p artifacts/enriched/e2e
              cp "$d"/*e2e-enriched-report.txt artifacts/enriched/e2e/ || true
            fi
            if ls "$d"/*tests-enriched-report.txt >/dev/null 2>&1; then
              mkdir -p artifacts/enriched/tests
              cp "$d"/*tests-enriched-report.txt artifacts/enriched/tests/ || true
            fi
            # copy anything else for manual inspection
            cp -r "$d" artifacts/downloaded-raw/ || true
          done

      - name: Collect TRX files into canonical folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-results
          # Copy any found TRX files into artifacts/test-results preserving names
          find artifacts/downloaded -type f -name '*.trx' -print0 | xargs -0 -I{} cp --parents {} artifacts/test-results/ || true
          # Also copy TRX files discovered anywhere in the workspace (fallback)
          find . -type f -name '*.trx' -not -path './artifacts/*' -print0 | xargs -0 -I{} cp {} artifacts/test-results/ || true
          # If we have at least one TRX, pick the first as a canonical all-tests.trx
          shopt -s nullglob || true
          files=(artifacts/test-results/**/*.trx artifacts/test-results/*.trx)
          if [ ${#files[@]} -gt 0 ]; then
            echo "Found ${#files[@]} TRX files; creating artifacts/test-results/all-tests.trx from the first one"
            cp "${files[0]}" artifacts/test-results/all-tests.trx || true
          else
            echo "No TRX files found to populate artifacts/test-results"
          fi

      - name: Upload consolidated test-results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-all
          path: artifacts/test-results/**
          overwrite: true

      - name: Aggregate summaries into final report
        id: aggregate
        shell: bash
        run: |
          # Ensure a known Python is available for the analyzer
          python3 --version || true

          set -euo pipefail
          out=final-report.txt
          echo "CI Final Test Summary" > $out
          echo "Generated (UTC): $(date -u)" >> $out
          any_failed=false

          gather() {
            type=$1
            json="artifacts/summaries/${type}/tests-summary.json"
            txt="artifacts/summaries/${type}/tests-summary.txt"
            echo "\n--- ${type^^} ---\n" >> $out
            if [ -f "$json" ]; then
              # Use a small helper to print summary to avoid YAML parser problems
              python3 scripts/print-summary.py "$json" >> $out
              failed=$(python3 -c "import json;print(int(json.load(open('$json')).get('failed',0)))")
              if [ "$failed" -gt 0 ]; then any_failed=true; fi
              if [ -f "$txt" ]; then
                echo "\nSummary details:" >> $out
                sed -n '1,200p' "$txt" >> $out
              fi
            else
              echo "(no ${type} summary)" >> $out
            fi
          }

          gather unit
          gather tests
          gather e2e
          gather integration

          # Append any per-analyzer enriched reports if present
          if [ -f "artifacts/enriched/unit/unit-tests-enriched-report.txt" ]; then
            echo "\n--- UNIT ENRICHED REPORT ---\n" >> $out
            sed -n '1,400p' artifacts/enriched/unit/unit-tests-enriched-report.txt >> $out
          fi
          if [ -f "artifacts/enriched/regression/regression-enriched-report.txt" ]; then
            echo "\n--- REGRESSION ENRICHED REPORT ---\n" >> $out
            sed -n '1,400p' artifacts/enriched/regression/regression-enriched-report.txt >> $out
          fi
          if [ -f "artifacts/enriched/integration/integration-enriched-report.txt" ]; then
            echo "\n--- INTEGRATION ENRICHED REPORT ---\n" >> $out
            sed -n '1,400p' artifacts/enriched/integration/integration-enriched-report.txt >> $out
          fi
          if [ -f "artifacts/enriched/e2e/e2e-enriched-report.txt" ]; then
            echo "\n--- E2E ENRICHED REPORT ---\n" >> $out
            sed -n '1,400p' artifacts/enriched/e2e/e2e-enriched-report.txt >> $out
          fi
          if [ -f "artifacts/enriched/tests/tests-enriched-report.txt" ]; then
            echo "\n--- TESTS ENRICHED REPORT ---\n" >> $out
            sed -n '1,400p' artifacts/enriched/tests/tests-enriched-report.txt >> $out
          fi

          echo "Wrote $out"
          echo "any_failed=$any_failed" >> $GITHUB_OUTPUT

      - name: Generate HTML final report
        shell: bash
        run: |
          set -euo pipefail
          # renderer will search recursively under artifacts/summaries
          python3 scripts/generate-final-report-html.py --src artifacts/summaries --out final-report.html || python3 scripts/generate-final-report-html.py --out final-report.html

      - name: Copy final report to stable artifacts/latest-report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/latest-report
          cp -f final-report.html artifacts/latest-report/final-report.html || true
          # include any enriched folders so links in the HTML resolve when downloaded
          if [ -d artifacts/enriched ]; then
            rm -rf artifacts/latest-report/enriched || true
            cp -r artifacts/enriched artifacts/latest-report/enriched || true
          fi

      - name: Upload latest report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-test-report
          path: |
            artifacts/latest-report/final-report.html
            artifacts/latest-report/enriched/**

      - name: Upload final report HTML
        uses: actions/upload-artifact@v4
        with:
          name: final-test-report-html
          path: final-report.html

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-test-report
          path: final-report.txt

      - name: Post final report as PR comment (on failures)
        if: ${{ steps.aggregate.outputs.any_failed == 'true' && github.event.pull_request != null }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Posting final report to PR #${PR_NUMBER}"
          body=$(python3 -c "import json,sys; print(json.dumps(open('final-report.txt',encoding='utf-8').read()))")
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"body\":$body}" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" > /dev/null
          echo "Comment posted"

      - name: Create check-run failure summary (on failures)
        if: ${{ steps.aggregate.outputs.any_failed == 'true' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.existsSync('final-report.txt') ? fs.readFileSync('final-report.txt','utf8') : '';
            const lines = body.split(/\r?\n/).slice(0,40).join('\n');
            const text = `\`\`\`\n${lines}\n\`\`\``;
            const output = {
              title: 'CI Failure Summary',
              summary: 'One or more test suites failed. See the full report artifact for details.',
              text: text
            };
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'CI Failure Summary',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'neutral',
                output: output
              });
            } catch (err) {
              if (err && err.status === 403) {
                console.log('Skipping check-run creation: Resource not accessible by integration (403)');
              } else {
                throw err;
              }
            }

      - name: Fail workflow if any tests failed
        if: ${{ steps.aggregate.outputs.any_failed == 'true' }}
        run: |
          echo "One or more test suites failed; marking workflow as failed"
          exit 1

      - name: Prepare failure-report PR files
        if: ${{ steps.aggregate.outputs.any_failed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          mkdir -p .github/ci-failures
          outf=".github/ci-failures/ci-failure-${sha}.md"
          echo "# CI Test Failures for ${GITHUB_SHA}" > "$outf"
          echo "" >> "$outf"
          echo 'Generated by CI. See the aggregated report attached.' >> "$outf"
          echo "" >> "$outf"
          echo '```' >> "$outf"
          sed -n '1,400p' final-report.txt >> "$outf" || true
          echo '```' >> "$outf"
          # also attach the generated HTML report if present
          if [ -f final-report.html ]; then
            cp -f final-report.html ".github/ci-failures/final-report-${sha}.html" || true
          fi

      - name: Create PR with failure report
        if: ${{ steps.aggregate.outputs.any_failed == 'true' }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "CI: test failures report (${GITHUB_SHA})"
          branch: "ci/failures-${{ github.sha }}"
          title: "CI: Test failures (${GITHUB_SHA})"
          body: |
            Automated PR containing the CI failure report generated by the workflow.

            - Aggregated text report: `.github/ci-failures/ci-failure-${{ github.sha }}.md`
            - HTML report (preview): `.github/ci-failures/final-report-${{ github.sha }}.html`

            You can also download artifacts for this workflow run (includes `latest-test-report`) here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the files in the PR to investigate failures.
          labels: ci-failure

      - name: Create gist of HTML report and comment on PR
        if: ${{ steps.aggregate.outputs.any_failed == 'true' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullSha = process.env.GITHUB_SHA || '';
            const short = (fullSha || '').substring(0,7);
            const htmlPath = `.github/ci-failures/final-report-${short}.html`;
            try {
              if (!fs.existsSync(htmlPath)) {
                console.log('HTML report not found at', htmlPath);
                return;
              }
              const content = fs.readFileSync(htmlPath, 'utf8');
              const gist = await github.rest.gists.create({
                files: { [`final-report-${short}.html`]: { content } },
                public: false,
                description: `CI final-report HTML for ${fullSha}`
              });
              console.log('Created gist', gist.data.html_url);

              // find the PR by head branch
              const head = `${owner}:ci/failures-${fullSha}`;
              const prs = await github.rest.pulls.list({ owner, repo, head });
              if (prs.data && prs.data.length > 0) {
                const prNumber = prs.data[0].number;
                // Post a short comment linking to the gist
                const linkBody = `HTML final report attached as gist: ${gist.data.html_url}`;
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: linkBody });
                console.log('Link comment posted on PR', prNumber);

                // Also post the HTML content as a comment (truncated if very large)
                const MAX_CHARS = parseInt(process.env.HTML_COMMENT_MAX_CHARS || '60000', 10) || 60000;
                let attachContent = content;
                let truncated = false;
                if (attachContent.length > MAX_CHARS) { attachContent = attachContent.slice(0, MAX_CHARS); truncated = true; }
                const htmlComment = `HTML final report (raw):\n\n---\n\n` + '```html\n' + attachContent + (truncated ? '\n\n... (truncated)' : '') + '\n```';
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: htmlComment });
                console.log('HTML content posted as comment on PR', prNumber, truncated ? '(truncated)' : '');
              } else {
                console.log('PR not found for head', head);
              }
            } catch (e) {
              console.log('Error creating gist or commenting:', e.message || e);
            }
        env:
          GITHUB_SHA: ${{ github.sha }}

  analyze-unit:
    name: Analyze Unit Test Results
    runs-on: ubuntu-latest
    if: always()
    needs: tests
    outputs:
      tests_ok: ${{ steps.summary.outputs.tests_ok }}
      failed_count: ${{ steps.summary.outputs.failed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unit test artifacts (Ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-tests-ubuntu-latest
          path: artifacts/unit/ubuntu
        continue-on-error: true

      - name: Download unit test artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-tests-windows-latest
          path: artifacts/unit/windows
        continue-on-error: true

      - name: Generate unit test summary (parse TRX)
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for TRX files under $(pwd)"
          mapfile -t files < <(find . -type f -name '*.trx' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No TRX files found; setting outputs and exiting"
            echo "tests_ok=false" >> $GITHUB_OUTPUT
            echo "failed_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 scripts/ci-analyze.py
          failed=$(python3 -c "import json; print(json.load(open('tests-summary.json'))['failed'])")
          if [ "$failed" -eq 0 ]; then
            echo "tests_ok=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ok=false" >> $GITHUB_OUTPUT
          fi
          echo "failed_count=$failed" >> $GITHUB_OUTPUT

      - name: Upload unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-summary
          path: |
            tests-summary.json
            tests-summary.txt

      - name: Run unit log analysis and enrich report (on failures)
        if: steps.summary.outputs.failed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "Unit failures detected, gathering logs and generating enriched report"
          mkdir -p artifacts/enriched/unit
          echo "=== Unit Tests Enriched Report ===" > unit-tests-enriched-report.txt
          echo "See tests-summary.json for full summary." >> unit-tests-enriched-report.txt
          echo "\n--- Failures ---\n" >> unit-tests-enriched-report.txt
          cat tests-summary.txt >> unit-tests-enriched-report.txt

          # Create per-failure folders with details and log excerpts
          if command -v jq >/dev/null 2>&1; then
            jq -c '.failures[]' tests-summary.json | while read -r fail; do
              name=$(echo "$fail" | jq -r '.name' | sed 's/[^a-zA-Z0-9._-]/_/g' | cut -c1-200)
              msg=$(echo "$fail" | jq -r '.message')
              fileloc=$(echo "$fail" | jq -r '.file')
              outdir="artifacts/enriched/unit/$name"
              mkdir -p "$outdir"
              echo "Name: $name" > "$outdir/details.txt"
              echo "Message:" >> "$outdir/details.txt"
              echo "$msg" >> "$outdir/details.txt"
              echo "Source file: $fileloc" >> "$outdir/details.txt"
              # copy trx if present
              if [ -f "$fileloc" ]; then
                cp "$fileloc" "$outdir/" || true
              fi
              # collect log excerpts nearby
              grep -RIn --binary-files=text -E "Exception|ERROR|Timeout|Assertion|404|Not Found" . | sed -n '1,200p' > "$outdir/log-excerpts.txt" || true
            done
          else
            echo "jq not available; skipping per-failure folder creation" >> unit-tests-enriched-report.txt
          fi

          echo "Wrote unit-tests-enriched-report.txt and per-failure folders"

      - name: Upload unit enriched report (failures) (attempt 1)
        id: upload_unit_enriched_fail_1
        if: steps.summary.outputs.failed_count != '0'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: unit-tests-enriched-report-${{ github.job }}-${{ runner.os }}
          path: unit-tests-enriched-report.txt

      - name: Upload unit enriched report (failures) (attempt 2)
        id: upload_unit_enriched_fail_2
        if: steps.upload_unit_enriched_fail_1.outcome != 'success'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: unit-tests-enriched-report-${{ github.job }}-${{ runner.os }}
          path: unit-tests-enriched-report.txt

      - name: Upload unit enriched report (failures) (attempt 3)
        if: steps.upload_unit_enriched_fail_1.outcome != 'success' && steps.upload_unit_enriched_fail_2.outcome != 'success'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: unit-tests-enriched-report-${{ github.job }}-${{ runner.os }}
          path: unit-tests-enriched-report.txt

  log-check:
    name: Conditional Log Inspection
    runs-on: ubuntu-latest
    needs: [analyze-results, analyze-unit, analyze-regression, analyze-integration, analyze-e2e]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server logs (Windows)
        uses: actions/download-artifact@v4
        with:
          name: server-log-Windows
          path: artifacts/logs/windows
        continue-on-error: true

      - name: Download server logs (Ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: server-log-ubuntu-latest
          path: artifacts/logs/ubuntu
        continue-on-error: true

      - name: Quick log scan for exceptions and errors
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning downloaded logs for ERROR/Exception/Timeout entries"
          find artifacts -type f -name '*.log' -print -exec grep -nE "Exception|ERROR|Unhandled|Timeout|fail(ed)?" {} + || true
          echo "Downloading any per-analyzer enriched reports (if present)"
          find artifacts -type f -name '*-enriched-report*.txt' -print -exec sed -n '1,200p' {} + || true
          echo "Log inspection complete"

  collect-ci-logs:
    name: Collect CI logs (opt-in)
    runs-on: ubuntu-latest
    needs: [test-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI logs collector
        if: ${{ github.event.inputs.collect_ci_logs == 'true' }}
        shell: pwsh
        run: |
          Write-Host "COLLECT_CI_LOGS enabled; running scripts/ci/ci-collect-logs.ps1"
          ./scripts/ci/ci-collect-logs.ps1 -OutDir artifacts/ci-logs || true
      - name: Upload CI logs artifact
        if: ${{ github.event.inputs.collect_ci_logs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: artifacts/ci-logs/**
          overwrite: true

