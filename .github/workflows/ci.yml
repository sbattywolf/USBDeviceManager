name: CI

on:
  push:
    branches: [ main, master, '**/chore/**', '**/feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  gui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx xvfb libx11-6 libxrender1 libxext6

      - name: Install GUI requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt

      - name: Run GUI tests (headless with Xvfb)
        run: |
          xvfb-run -s "-screen 0 1280x1024x24" pytest -q gui/tests

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: gui-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet
        run: dotnet restore USBDeviceManager.sln

      - name: Ensure server stopped (optional auto-kill)
        shell: pwsh
        run: |
          if (Test-Path .\scripts\ensure-server-stopped.ps1) {
            Write-Host 'Running ensure-server-stopped.ps1 (respects AUTO_KILL env var).'
            & .\scripts\ensure-server-stopped.ps1
            $rc = $LASTEXITCODE
            if ($rc -eq 2) {
              Write-Host "ensure-server-stopped returned 2 (AUTO_KILL=false and process present). Continuing as configured."
            } elseif ($rc -ne 0) {
              throw "ensure-server-stopped.ps1 failed with exit code $rc"
            }
          } else {
            Write-Host 'No ensure-server-stopped.ps1 present; skipping.'
          }

      - name: Build
        run: dotnet build USBDeviceManager.sln --configuration Release --no-restore

      - name: Run Unit tests (produce TRX)
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Unit" --logger "trx;LogFileName=dotnet-tests-${{ matrix.os }}.trx"

      - name: Run isolated AgentHeartbeat tests
        run: |
          if (Test-Path server/AgentHeartbeat.Tests) {
            dotnet test server/AgentHeartbeat.Tests/AgentHeartbeat.Tests.csproj --configuration Debug --logger "trx;LogFileName=agentheartbeat-${{ matrix.os }}.trx"
          } else {
            echo 'No isolated AgentHeartbeat.Tests project found; skipping.'
          }

      - name: Upload dotnet test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-tests-${{ matrix.os }}
          path: |
            '**/*dotnet-tests-${{ matrix.os }}.trx'
            '**/*dotnet-tests.local.trx'
            server/AgentHeartbeat.Tests/**/TestResults/*.trx

      - name: Run sanitize-repo check (PowerShell script)
        shell: pwsh
        run: |
          if (Test-Path .\scripts\sanitize-repo.ps1) { .\scripts\sanitize-repo.ps1 -CheckOnly } else { Write-Host 'No sanitize script present, skipping.' }

      - name: Run PowerShell agent tests (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path .\ci\run-tests.ps1) {
            .\ci\run-tests.ps1 -RunAgentTests -RunServerTests:$false -NonInteractive
          } elseif (Test-Path .\agent\SimRacingAgent.Tests) {
            Import-Module Pester -Force -MinimumVersion 5.0
            Invoke-Pester -Script @{ Path = '.\agent\SimRacingAgent.Tests'; OutputFormat = 'NUnitXml'; OutputFile = 'agent-pester-results.xml' }
            Write-Host 'Pester results: agent-pester-results.xml'
          } else {
            Write-Host 'No agent tests found; skipping.'
          }

      - name: Run Master TestRunner (PowerShell, cross-platform)
        shell: pwsh
        run: |
          if (Test-Path ./agent/SimRacingAgent.Tests/TestRunner.ps1) {
            Write-Host 'Invoking master TestRunner (agent + server focused runners)...'
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./agent/SimRacingAgent.Tests/TestRunner.ps1
          } else {
            Write-Host 'No master TestRunner found; skipping.'
          }

      - name: Upload agent test results (Windows only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-tests-windows
          path: |
            agent-pester-results.xml
            **/TestResults/*.trx
            agent/SimRacingAgent.Tests/Integration/logs/**
            server/USBDeviceManager.Tests/Integration/logs/**
            agent/SimRacingAgent.Tests/Functional/logs/**
            agent/SimRacingAgent.Tests/logs/**

      - name: Upload server logs (build matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.os }}
          path: |
            scripts/tmp/server.log
            scripts/tmp/server.err.log
            scripts/tmp/ensure-stopped.log
  e2e-windows:
    runs-on: windows-latest
    needs: build-and-test
    # Make this job non-blocking so PRs are not blocked by E2E flakes
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore USBDeviceManager.sln

      - name: Build
        run: dotnet build server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Release --no-restore

      - name: Run Agent E2E tests (Windows)
        run: |
          dotnet test server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Debug --logger "trx;LogFileName=AgentE2E.windows.trx"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-windows
          path: server/AgentE2E.Tests/**/TestResults/*.trx

  integration-tests:
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Start server for Integration tests (PowerShell)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./scripts/start-server-and-wait.ps1) { .\scripts\start-server-and-wait.ps1 -NonInteractive } else { Write-Host 'No orchestration script present, skipping server start.' }

      - name: Run Integration tests
        shell: pwsh
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Integration" --logger "trx;LogFileName=integration-${{ runner.os }}.trx"

      - name: Stop test environment (PowerShell)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./scripts/stop-test-environment.ps1) { .\scripts\stop-test-environment.ps1 } else { Write-Host 'No stop script present.' }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ runner.os }}
          path: |
            scripts/tmp/server.log
            scripts/tmp/server.err.log
            scripts/tmp/ensure-stopped.log

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-${{ runner.os }}
          path: '**/*integration-${{ runner.os }}.trx'
