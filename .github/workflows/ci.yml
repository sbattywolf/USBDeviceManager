name: CI

on:
  push:
    branches: [ main, master, '**/chore/**', '**/feat/**' ]
  pull_request:
    branches: [ main, master ]

env:
  CI_BIND_ADDRESS: 127.0.0.1

jobs:
  gui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system GUI dependencies
        run: |
          set -e
          sudo apt-get update
          # Install Mesa/GL packages commonly required by headless PyQt/OpenGL users.
          # Relax package list to use packages available on newer Ubuntu runners,
          # and include `mesa-utils` as a fallback.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libgbm1 xvfb mesa-utils \
            libx11-6 libxrender1 libxext6 libxcb1 libxkbcommon0 \
            ca-certificates || true
          sudo apt-get clean || true

      - name: Install GUI requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt

      - name: Run GUI tests (headless with Xvfb)
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -s "-screen 0 1280x1024x24" pytest -q gui/tests

  build-and-test:
    name: Build (no tests)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: gui-tests
    env:
      CI_BIND_ADDRESS: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: pwsh
        run: |
          # Retry wrapper for transient NuGet failures (3 attempts with exponential backoff)
          $maxAttempts = 3
          $baseDelay = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "dotnet restore attempt $i of $maxAttempts"
            dotnet restore USBDeviceManager.sln --verbosity minimal
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxAttempts) {
              $delay = $baseDelay * [math]::Pow(2, $i - 1)
              Write-Host "Restore failed; sleeping $delay seconds before retrying..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "dotnet restore failed after $maxAttempts attempts"
            exit 1
          }

      - name: Publish long-run test helper
        shell: pwsh
        run: |
          if (Test-Path test-helpers/LongRunner) {
            dotnet publish test-helpers/LongRunner/LongRunner.csproj -c Release -o ./artifacts/longrunner
            Write-Host 'Published LongRunner to ./artifacts/longrunner'
          } else {
            Write-Host 'No long-run helper found; continuing without it.'
          }

      - name: Build
        run: dotnet build USBDeviceManager.sln --configuration Release --no-restore

  tests:
    name: Run Tests and Upload Results
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: [gui-tests, build-and-test]
    env:
      CI_BIND_ADDRESS: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: pwsh
        run: |
          $maxAttempts = 3
          $baseDelay = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "dotnet restore attempt $i of $maxAttempts"
            dotnet restore USBDeviceManager.sln --verbosity minimal
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxAttempts) {
              $delay = $baseDelay * [math]::Pow(2, $i - 1)
              Write-Host "Restore failed; sleeping $delay seconds before retrying..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "dotnet restore failed after $maxAttempts attempts"
            exit 1
          }

      - name: Publish long-run test helper
        shell: pwsh
        run: |
          if (Test-Path test-helpers/LongRunner) {
            dotnet publish test-helpers/LongRunner/LongRunner.csproj -c Release -o ./artifacts/longrunner
            Write-Host 'Published LongRunner to ./artifacts/longrunner'
          } else {
            Write-Host 'No long-run helper found; continuing without it.'
          }

      - name: Detect long-sleep command for ShellRunner tests
        run: |
          echo "Detecting long-sleep helper for ShellRunner tests"

      - name: Set SHELLRUNNER_LONG_CMD (Linux)
        if: runner.os == 'Linux' || runner.os == 'Ubuntu' || runner.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f ./artifacts/longrunner/LongRunner.dll ]; then
            echo "SHELLRUNNER_LONG_CMD=dotnet|./artifacts/longrunner/LongRunner.dll --duration=30" >> $GITHUB_ENV
            echo "Set SHELLRUNNER_LONG_CMD to LongRunner via dotnet"
          elif [ -x /bin/bash ] && /bin/bash -c "sleep 0" >/dev/null 2>&1; then
            echo "SHELLRUNNER_LONG_CMD=/bin/bash|-c \"sleep 30\"" >> $GITHUB_ENV
            echo "Set SHELLRUNNER_LONG_CMD for bash"
          elif command -v sleep >/dev/null 2>&1; then
            echo "SHELLRUNNER_LONG_CMD=/bin/sh|-c \"sleep 30\"" >> $GITHUB_ENV
            echo "Set SHELLRUNNER_LONG_CMD for sh"
          else
            echo "No sleep command detected; leaving SHELLRUNNER_LONG_CMD unset"
          fi

      - name: Set SHELLRUNNER_LONG_CMD (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helperDll = Join-Path $env:GITHUB_WORKSPACE 'artifacts/longrunner/LongRunner.dll'
          if (Test-Path $helperDll) {
            "SHELLRUNNER_LONG_CMD=dotnet|$helperDll --duration=30" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
            Write-Host "Set SHELLRUNNER_LONG_CMD to LongRunner via dotnet"
          }
          else {
            if (Get-Command powershell -ErrorAction SilentlyContinue) {
              "SHELLRUNNER_LONG_CMD=powershell|-Command Start-Sleep -Seconds 30" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
              Write-Host "Set SHELLRUNNER_LONG_CMD for powershell"
            }
            elseif (Get-Command pwsh -ErrorAction SilentlyContinue) {
              "SHELLRUNNER_LONG_CMD=pwsh|-Command Start-Sleep -Seconds 30" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
              Write-Host "Set SHELLRUNNER_LONG_CMD for pwsh"
            }
            else {
              Write-Host "No PowerShell found; leaving SHELLRUNNER_LONG_CMD unset"
            }
          }

      - name: Enable in-process smoke server for CI (cross-platform)
        run: |
          echo "SMOKE_USE_TESTSERVER=1" >> $GITHUB_ENV

      - name: Ensure server stopped (optional auto-kill)
        shell: pwsh
        run: |
          if (Test-Path .\scripts\ensure-server-stopped.ps1) {
            Write-Host 'Running ensure-server-stopped.ps1 (respects AUTO_KILL env var).'
            $pwshPath = (Get-Command pwsh -ErrorAction SilentlyContinue)?.Source ?? 'pwsh'
            $args = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File', "$PWD\scripts\ensure-server-stopped.ps1")
            $proc = Start-Process -FilePath $pwshPath -ArgumentList $args -NoNewWindow -PassThru -Wait
            $rc = $proc.ExitCode
            if ($rc -eq 2) {
              Write-Host "ensure-server-stopped returned 2 (AUTO_KILL=false and process present). Continuing as configured."
            } elseif ($rc -ne 0) {
              throw "ensure-server-stopped.ps1 failed with exit code $rc"
            }
          } else {
            Write-Host 'No ensure-server-stopped.ps1 present; skipping.'
          }

      - name: Build
        run: dotnet build USBDeviceManager.sln --configuration Release --no-restore

      - name: Run Unit tests (produce TRX)
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Unit" --logger "trx;LogFileName=dotnet-tests-${{ matrix.os }}.trx"

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: build-and-test
    env:
      CI_BIND_ADDRESS: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet (with retries)
        shell: pwsh
        run: |
          $maxAttempts = 3
          $baseDelay = 5
          $success = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "dotnet restore attempt $i of $maxAttempts"
            dotnet restore USBDeviceManager.sln --verbosity minimal
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxAttempts) {
              $delay = $baseDelay * [math]::Pow(2, $i - 1)
              Write-Host "Restore failed; sleeping $delay seconds before retrying..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "dotnet restore failed after $maxAttempts attempts"
            exit 1
          }

      - name: Build
        run: dotnet build USBDeviceManager.sln --configuration Release --no-restore

      - name: Run Unit tests (produce TRX)
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Unit" --logger "trx;LogFileName=dotnet-unit-tests-${{ matrix.os }}.trx"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-tests-${{ matrix.os }}
          path: |
            '**/*dotnet-unit-tests-${{ matrix.os }}.trx'
            '**/*dotnet-tests.local.trx'
            '**/TestResults/*.trx'
            '**/*/TestResults/*.trx'

      - name: Run isolated AgentHeartbeat tests
        shell: pwsh
        run: |
          if (Test-Path server/AgentHeartbeat.Tests) {
            dotnet test server/AgentHeartbeat.Tests/AgentHeartbeat.Tests.csproj --configuration Debug --logger "trx;LogFileName=agentheartbeat-${{ matrix.os }}.trx"
          } else {
            Write-Host 'No isolated AgentHeartbeat.Tests project found; skipping.'
          }

      - name: Upload dotnet test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-tests-${{ matrix.os }}
          path: |
            '**/*dotnet-tests-${{ matrix.os }}.trx'
            '**/*dotnet-tests.local.trx'
            '**/TestResults/*.trx'
            '**/*/TestResults/*.trx'
            server/AgentHeartbeat.Tests/**/TestResults/*.trx
            server/**/TestResults/*.trx

      - name: Run sanitize-repo check (PowerShell script)
        shell: pwsh
        run: |
          if (Test-Path .\scripts\sanitize-repo.ps1) { .\scripts\sanitize-repo.ps1 -CheckOnly } else { Write-Host 'No sanitize script present, skipping.' }

      - name: Run PowerShell agent tests (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path .\ci\run-tests.ps1) {
            .\ci\run-tests.ps1 -RunAgentTests -RunServerTests:$false -NonInteractive
          } elseif (Test-Path .\agent\SimRacingAgent.Tests) {
            Import-Module Pester -Force -MinimumVersion 5.0
            Invoke-Pester -Script @{ Path = '.\agent\SimRacingAgent.Tests'; OutputFormat = 'NUnitXml'; OutputFile = 'agent-pester-results.xml' }
            Write-Host 'Pester results: agent-pester-results.xml'
          } else {
            Write-Host 'No agent tests found; skipping.'
          }

      - name: Run Master TestRunner (PowerShell, cross-platform)
        shell: pwsh
        run: |
          if (Test-Path ./agent/SimRacingAgent.Tests/TestRunner.ps1) {
            Write-Host 'Invoking master TestRunner (agent + server focused runners)...'
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./agent/SimRacingAgent.Tests/TestRunner.ps1
          } else {
            Write-Host 'No master TestRunner found; skipping.'
          }

      - name: Upload agent test results (Windows only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-tests-windows
          path: |
            agent-pester-results.xml
            **/TestResults/*.trx
            agent/SimRacingAgent.Tests/Integration/logs/**
            server/USBDeviceManager.Tests/Integration/logs/**
            agent/SimRacingAgent.Tests/Functional/logs/**
            agent/SimRacingAgent.Tests/logs/**

      - name: Upload server logs (build matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.os }}
          path: |
            scripts/tmp/server.log
            scripts/tmp/server.err.log
            scripts/tmp/ensure-stopped.log
  e2e-windows:
    runs-on: windows-latest
    needs: analyze-results
    if: ${{ needs.analyze-results.outputs.tests_ok == 'true' }}
    steps:
      - name: Set TEST_PORT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start()
          $port = ($listener.LocalEndpoint -as [System.Net.IPEndPoint]).Port
          $listener.Stop()
          "TEST_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
          Write-Host "Set TEST_PORT=$port"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore USBDeviceManager.sln

      - name: Restore AgentE2E project
        run: dotnet restore server/AgentE2E.Tests/AgentE2E.Tests.csproj

      - name: Build
        run: dotnet build server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Release --no-restore

      - name: Run Agent E2E tests (Windows)
        run: |
          dotnet test server/AgentE2E.Tests/AgentE2E.Tests.csproj --configuration Debug --logger "trx;LogFileName=AgentE2E.windows.trx"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-windows
          path: server/AgentE2E.Tests/**/TestResults/*.trx

  integration-tests:
    runs-on: windows-latest
    needs: analyze-results
    if: ${{ needs.analyze-results.outputs.tests_ok == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Set TEST_PORT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start()
          $port = ($listener.LocalEndpoint -as [System.Net.IPEndPoint]).Port
          $listener.Stop()
          "TEST_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append
          Write-Host "Set TEST_PORT=$port"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Start server for Integration tests (PowerShell)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./scripts/start-server-and-wait.ps1) { .\scripts\start-server-and-wait.ps1 -NonInteractive -Port $Env:TEST_PORT } else { Write-Host 'No orchestration script present, skipping server start.' }

      - name: Run Integration tests
        shell: pwsh
        run: |
          dotnet test USBDeviceManager.sln --configuration Debug --filter "Category=Integration" --logger "trx;LogFileName=integration-${{ runner.os }}.trx"

      - name: Stop test environment (PowerShell)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./scripts/stop-test-environment.ps1) { .\scripts\stop-test-environment.ps1 } else { Write-Host 'No stop script present.' }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ runner.os }}
          path: |
            scripts/tmp/server.log
            scripts/tmp/server.err.log
            scripts/tmp/ensure-stopped.log

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-${{ runner.os }}
          path: '**/*integration-${{ runner.os }}.trx'

  analyze-results:
    name: Analyze Test Results
    runs-on: ubuntu-latest
    needs: tests
    outputs:
      tests_ok: ${{ steps.summary.outputs.tests_ok }}
      failed_count: ${{ steps.summary.outputs.failed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dotnet test artifacts (Ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-tests-ubuntu-latest
          path: artifacts/tests/ubuntu
        continue-on-error: true

      - name: Download unit test artifacts (Ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-tests-ubuntu-latest
          path: artifacts/unit/ubuntu
        continue-on-error: true

      - name: Download dotnet test artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-tests-windows-latest
          path: artifacts/tests/windows
        continue-on-error: true

      - name: Download unit test artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-tests-windows-latest
          path: artifacts/unit/windows
        continue-on-error: true

      - name: Download agent & integration artifacts (if present)
        uses: actions/download-artifact@v4
        with:
          name: agent-tests-windows
          path: artifacts/agent
        continue-on-error: true

      - name: Generate test summary (parse TRX)
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for TRX files under $(pwd)"
          mapfile -t files < <(find . -type f -name '*.trx' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No TRX files found; setting outputs and exiting"
            echo "tests_ok=false" >> $GITHUB_OUTPUT
            echo "failed_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
            python3 scripts/ci-analyze.py
          failed=$(python3 -c "import json; print(json.load(open('tests-summary.json'))['failed'])")
          if [ "$failed" -eq 0 ]; then
            echo "tests_ok=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ok=false" >> $GITHUB_OUTPUT
          fi
          echo "failed_count=$failed" >> $GITHUB_OUTPUT

      - name: Upload test summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-summary
          path: |
            tests-summary.json
            tests-summary.txt

      - name: Run log analysis and enrich report (on failures)
        if: steps.summary.outputs.failed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "Failures detected, gathering logs and generating enriched report"
          mkdir -p artifacts/logs
          mapfile -t logs < <(find . -type f -name '*.log' || true)
          echo "Found ${#logs[@]} log files"
          echo "=== Enriched Test Report ===" > tests-enriched-report.txt
          echo "See tests-summary.json for full summary." >> tests-enriched-report.txt
          echo "\n--- Failures ---\n" >> tests-enriched-report.txt
          cat tests-summary.txt >> tests-enriched-report.txt
          echo "\n--- Log excerpts (prioritized) ---\n" >> tests-enriched-report.txt
          for kw in Exception ERROR Timeout Assertion; do
            echo "\n== $kw ==" >> tests-enriched-report.txt
            grep -RIn --binary-files=text -E "$kw" . | sed -n '1,200p' >> tests-enriched-report.txt || true
          done
          echo "Wrote tests-enriched-report.txt"

      - name: Upload enriched report (failures)
        if: steps.summary.outputs.failed_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tests-enriched-report
          path: tests-enriched-report.txt

  analyze-e2e:
    name: Analyze E2E Results
    runs-on: ubuntu-latest
    needs: e2e-windows
    outputs:
      tests_ok: ${{ steps.summary.outputs.tests_ok }}
      failed_count: ${{ steps.summary.outputs.failed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download E2E artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: agent-e2e-windows
          path: artifacts/e2e/windows
        continue-on-error: true

      - name: Generate E2E summary (parse TRX)
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-analyze.py
          failed=$(python3 -c "import json; print(json.load(open('tests-summary.json'))['failed'])")
          if [ "$failed" -eq 0 ]; then
            echo "tests_ok=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ok=false" >> $GITHUB_OUTPUT
          fi
          echo "failed_count=$failed" >> $GITHUB_OUTPUT

      - name: Upload E2E summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tests-summary
          path: |
            tests-summary.json
            tests-summary.txt

      - name: Enrich E2E report (on failures)
        if: steps.summary.outputs.failed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "E2E failures detected; generating enriched E2E report"
          echo "=== E2E Enriched Report ===" > e2e-enriched-report.txt
          cat tests-summary.txt >> e2e-enriched-report.txt
          grep -RIn --binary-files=text -E "Exception|ERROR|Timeout|Assertion" . | sed -n '1,200p' >> e2e-enriched-report.txt || true

      - name: Upload E2E enriched report
        if: steps.summary.outputs.failed_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-enriched-report
          path: e2e-enriched-report.txt

  analyze-integration:
    name: Analyze Integration Results
    runs-on: ubuntu-latest
    needs: integration-tests
    outputs:
      tests_ok: ${{ steps.summary.outputs.tests_ok }}
      failed_count: ${{ steps.summary.outputs.failed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download integration artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: integration-tests-windows
          path: artifacts/integration/windows
        continue-on-error: true

      - name: Generate integration summary (parse TRX)
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-analyze.py
          failed=$(python3 -c "import json; print(json.load(open('tests-summary.json'))['failed'])")
          if [ "$failed" -eq 0 ]; then
            echo "tests_ok=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ok=false" >> $GITHUB_OUTPUT
          fi
          echo "failed_count=$failed" >> $GITHUB_OUTPUT

      - name: Upload integration summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-summary
          path: |
            tests-summary.json
            tests-summary.txt

      - name: Enrich integration report (on failures)
        if: steps.summary.outputs.failed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "Integration failures detected; generating enriched integration report"
          echo "=== Integration Enriched Report ===" > integration-enriched-report.txt
          cat tests-summary.txt >> integration-enriched-report.txt
          grep -RIn --binary-files=text -E "Exception|ERROR|Timeout|Assertion" . | sed -n '1,200p' >> integration-enriched-report.txt || true

      - name: Upload integration enriched report
        if: steps.summary.outputs.failed_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: integration-enriched-report
          path: integration-enriched-report.txt

  analyze-unit:
    name: Analyze Unit Test Results
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      tests_ok: ${{ steps.summary.outputs.tests_ok }}
      failed_count: ${{ steps.summary.outputs.failed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unit test artifacts (Ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-tests-ubuntu-latest
          path: artifacts/unit/ubuntu
        continue-on-error: true

      - name: Download unit test artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-tests-windows-latest
          path: artifacts/unit/windows
        continue-on-error: true

      - name: Generate unit test summary (parse TRX)
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for TRX files under $(pwd)"
          mapfile -t files < <(find . -type f -name '*.trx' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No TRX files found; setting outputs and exiting"
            echo "tests_ok=false" >> $GITHUB_OUTPUT
            echo "failed_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 scripts/ci-analyze.py
          failed=$(python3 -c "import json; print(json.load(open('tests-summary.json'))['failed'])")
          if [ "$failed" -eq 0 ]; then
            echo "tests_ok=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ok=false" >> $GITHUB_OUTPUT
          fi
          echo "failed_count=$failed" >> $GITHUB_OUTPUT

      - name: Upload unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-summary
          path: |
            tests-summary.json
            tests-summary.txt

      - name: Run unit log analysis and enrich report (on failures)
        if: steps.summary.outputs.failed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "Unit failures detected, gathering logs and generating enriched report"
          mkdir -p artifacts/logs
          mapfile -t logs < <(find . -type f -name '*.log' || true)
          echo "Found ${#logs[@]} log files"
          echo "=== Unit Tests Enriched Report ===" > unit-tests-enriched-report.txt
          echo "See tests-summary.json for full summary." >> unit-tests-enriched-report.txt
          echo "\n--- Failures ---\n" >> unit-tests-enriched-report.txt
          cat tests-summary.txt >> unit-tests-enriched-report.txt
          echo "\n--- Log excerpts (prioritized) ---\n" >> unit-tests-enriched-report.txt
          for kw in Exception ERROR Timeout Assertion; do
            echo "\n== $kw ==" >> unit-tests-enriched-report.txt
            grep -RIn --binary-files=text -E "$kw" . | sed -n '1,200p' >> unit-tests-enriched-report.txt || true
          done
          echo "Wrote unit-tests-enriched-report.txt"

      - name: Upload unit enriched report (failures)
        if: steps.summary.outputs.failed_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-enriched-report
          path: unit-tests-enriched-report.txt

  log-check:
    name: Conditional Log Inspection
    runs-on: ubuntu-latest
    needs: analyze-results
    if: ${{ needs.analyze-results.outputs.tests_ok != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server logs (Windows)
        uses: actions/download-artifact@v4
        with:
          name: server-log-Windows
          path: artifacts/logs/windows
        continue-on-error: true

      - name: Download server logs (Ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: server-log-ubuntu-latest
          path: artifacts/logs/ubuntu
        continue-on-error: true

      - name: Quick log scan for exceptions and errors
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning downloaded logs for ERROR/Exception/Timeout entries"
          find artifacts -type f -name '*.log' -print -exec grep -nE "Exception|ERROR|Unhandled|Timeout|fail(ed)?" {} + || true
          echo "Log inspection complete"
