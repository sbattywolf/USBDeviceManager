<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .bg{fill:#f7f9fb}
    .card{fill:#fff;stroke:#e6e9ef;rx:8}
    .title{font:600 20px 'Inter',sans-serif;fill:#0b1622}
    .muted{font:400 13px 'Inter',sans-serif;fill:#6b7280}
    .mono{font:400 12px 'Courier New',monospace;fill:#0f1724}
  </style>
  <rect class="bg" width="1200" height="800"/>
  <rect x="260" y="20" width="920" height="60" rx="8" class="card" />
  <text x="280" y="58" class="title">Logs</text>

  <rect x="260" y="100" width="920" height="620" rx="8" class="card" />
  <text x="280" y="132" class="muted">Filter • Source • Level • Time Range</text>

  <!-- Log area -->
  <rect x="280" y="170" width="860" height="520" rx="6" fill="#0b0b0b" />
  <text x="294" y="196" class="mono" fill="#9ca3af">[INFO] 2026-01-19 17:14:42 - Server starting...</text>
  <text x="294" y="216" class="mono" fill="#e6e6e6">[DEBUG] 2026-01-19 17:14:44 - Established DB connection</text>
  <text x="294" y="236" class="mono" fill="#fca5a5">[ERROR] 2026-01-19 17:15:01 - Failed to bind: address already in use</text>

  <text x="280" y="710" class="muted">Auto-scroll • Pause • Clear • Download</text>
</svg>