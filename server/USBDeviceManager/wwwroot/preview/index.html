<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>USBDeviceManager Embedded Preview</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; padding: 16px; }
      h1 { color: #222; }
      .status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>USBDeviceManager Embedded Preview</h1>
    <p>This is a simple preview page for the embedded GUI PoC. The embedded app will navigate here.</p>
    <div class="status">
      <strong>Server:</strong> <span id="serverStatus">unknown</span>
    </div>

    <script>
      async function check() {
        try {
          const r = await fetch('/api/health');
          document.getElementById('serverStatus').textContent = r.ok ? 'running' : 'unavailable';
        } catch (e) {
          document.getElementById('serverStatus').textContent = 'unreachable';
        }
      }
      check();
    </script>
  </body>
</html>
